/*
    To make release and increase version:
        gradlew -Preckon.stage=final -Preckon.scope=patch reckonTagPush
        gradlew -Preckon.stage=final -Preckon.scope=minor reckonTagPush
        gradlew -Preckon.stage=final -Preckon.scope=major reckonTagPush

        https://git.sr.ht/~ajoberstar/reckon
 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'

    //id 'se.ascp.gradle.gradle-versions-filter' version '0.1.16'
    id 'org.ajoberstar.grgit' version '5.3.3'
    id 'org.beryx.jlink' version '4.1.1'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {

    implementation 'commons-cli:commons-cli:1.11.0'
    implementation 'com.google.guava:guava:33.7.1-jre'

    implementation 'org.slf4j:slf4j-api:2.0.19'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.1'

    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    //implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.svs.duty.App'
}

import org.apache.tools.ant.filters.ReplaceTokens
import java.time.ZonedDateTime
import java.time.format.DateTimeFormatter

processResources {
    filesMatching('**/version.properties') {
        filter(ReplaceTokens,
                tokens: [
                        'git.commit': grgit.head().abbreviatedId,
                        'git.date': grgit.head().dateTime.format(DateTimeFormatter.RFC_1123_DATE_TIME),
                        'build.date': ZonedDateTime.now().format(DateTimeFormatter.RFC_1123_DATE_TIME),
                        'build.builtby': System.getProperty("user.name", "<unknown>") + '@' + InetAddress.localHost.hostName,
                        'version': project.version.toString()
                ])
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
